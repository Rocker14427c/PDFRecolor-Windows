<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect width="800" height="600" fill="#1a1b2e"/>
  
  <!-- Title bar -->
  <rect width="800" height="36" fill="#252640"/>
  <circle cx="20" cy="18" r="6" fill="#ef5350"/>
  <circle cx="42" cy="18" r="6" fill="#f39c12"/>
  <circle cx="64" cy="18" r="6" fill="#66bb6a"/>
  <text x="400" y="23" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="12">PDF Recolor</text>
  
  <!-- Upload container -->
  <rect x="160" y="120" width="480" height="360" rx="16" fill="#2a2b45" stroke="#7c6bf0" stroke-width="2"/>
  
  <!-- Brand badge -->
  <rect x="360" y="150" width="80" height="80" rx="20" fill="url(#badgeGrad)"/>
  <text x="400" y="200" text-anchor="middle" font-size="40">🎨</text>
  
  <!-- Title -->
  <text x="400" y="260" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="24" font-weight="bold">PDF Recolor</text>
  <text x="400" y="285" text-anchor="middle" fill="#a0a0c0" font-family="Segoe UI" font-size="14">One color. One click. Done.</text>
  
  <!-- Upload zone -->
  <rect x="200" y="310" width="400" height="80" rx="12" fill="#2a2b45" stroke="#33345a" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="220" y="330" width="44" height="44" rx="10" fill="#33345a"/>
  <text x="242" y="360" text-anchor="middle" font-size="22">📄</text>
  <text x="340" y="345" fill="#f0f0f8" font-family="Segoe UI" font-size="14" font-weight="600">Tap to select PDF</text>
  <text x="340" y="365" fill="#a0a0c0" font-family="Segoe UI" font-size="12">Opens your file manager</text>
  
  <!-- Browse button -->
  <rect x="200" y="410" width="400" height="50" rx="12" fill="url(#btnGrad)"/>
  <text x="400" y="442" text-anchor="middle" fill="white" font-family="Segoe UI" font-size="14" font-weight="600">📁 Choose PDF File</text>
  
  <!-- Footer -->
  <text x="400" y="540" text-anchor="middle" fill="#6a6a90" font-family="Segoe UI" font-size="11">100% offline · Your files stay private</text>
  <text x="400" y="558" text-anchor="middle" fill="#6a6a90" font-family="Segoe UI" font-size="11">Supports any PDF up to 100 pages</text>
  
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6bf0"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6bf0"/>
      <stop offset="100%" stop-color="#5a49d4"/>
    </linearGradient>
  </defs>
</svg>
