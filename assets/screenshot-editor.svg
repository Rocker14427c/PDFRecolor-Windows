<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect width="800" height="600" fill="#12131f"/>
  
  <!-- Title bar -->
  <rect width="800" height="36" fill="#1a1b2e"/>
  <circle cx="20" cy="18" r="6" fill="#ef5350"/>
  <circle cx="42" cy="18" r="6" fill="#f39c12"/>
  <circle cx="64" cy="18" r="6" fill="#66bb6a"/>
  <text x="400" y="23" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="12">PDF Recolor - document.pdf</text>
  
  <!-- Sidebar -->
  <rect width="280" height="564" fill="#1a1b2e"/>
  
  <!-- Sidebar header -->
  <text x="20" y="28" fill="#f0f0f8" font-family="Segoe UI" font-size="13" font-weight="600">🎨 PDF Recolor</text>
  <rect x="250" y="12" width="20" height="20" rx="4" fill="#2a2b45"/>
  <text x="260" y="26" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="14">↺</text>
  
  <!-- File info -->
  <rect y="48" width="280" height="50" fill="#1e1f33"/>
  <text x="20" y="72" fill="#f0f0f8" font-family="Segoe UI" font-size="12" font-weight="600">document.pdf</text>
  <text x="20" y="90" fill="#a0a0c0" font-family="Segoe UI" font-size="11">Pages: 5</text>
  
  <!-- Control section - Color -->
  <text x="20" y="130" fill="#6a6a90" font-family="Segoe UI" font-size="10" font-weight="600" text-transform="uppercase">TARGET COLOR</text>
  
  <rect x="20" y="145" width="48" height="48" rx="10" fill="#7c6bf0"/>
  <rect x="80" y="145" width="180" height="48" rx="8" fill="#2a2b45" stroke="#33345a"/>
  <text x="95" y="178" fill="#6a6a90" font-family="Segoe UI" font-size="16">#</text>
  <text x="110" y="178" fill="#f0f0f8" font-family="Consolas" font-size="14" font-weight="600">7C6BF0</text>
  
  <!-- Presets -->
  <text x="20" y="220" fill="#6a6a90" font-family="Segoe UI" font-size="10" font-weight="600">COLOR PRESETS</text>
  
  <circle cx="40" cy="250" r="15" fill="#7c6bf0" stroke="white" stroke-width="2"/>
  <circle cx="80" cy="250" r="15" fill="#4a90e2"/>
  <circle cx="120" cy="250" r="15" fill="#e74c3c"/>
  <circle cx="160" cy="250" r="15" fill="#2ecc71"/>
  <circle cx="200" cy="250" r="15" fill="#f39c12"/>
  
  <circle cx="40" cy="290" r="15" fill="#e91e63"/>
  <circle cx="80" cy="290" r="15" fill="#00bcd4"/>
  <circle cx="120" cy="290" r="15" fill="#1a1a2e"/>
  <circle cx="160" cy="290" r="15" fill="#ff6b35"/>
  <circle cx="200" cy="290" r="15" fill="#000000"/>
  
  <!-- Page Navigation -->
  <text x="20" y="340" fill="#6a6a90" font-family="Segoe UI" font-size="10" font-weight="600">PAGE NAVIGATION</text>
  <rect x="20" y="355" width="70" height="36" rx="6" fill="#2a2b45"/>
  <text x="55" y="378" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="11">‹ Prev</text>
  <text x="140" y="378" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="12" font-weight="600">2 / 5</text>
  <rect x="190" y="355" width="70" height="36" rx="6" fill="#2a2b45"/>
  <text x="225" y="378" text-anchor="middle" fill="#f0f0f8" font-family="Segoe UI" font-size="11">Next ›</text>
  
  <!-- Export button -->
  <rect x="20" y="500" width="240" height="44" rx="10" fill="url(#exportGrad)"/>
  <text x="140" y="528" text-anchor="middle" fill="white" font-family="Segoe UI" font-size="13" font-weight="700">⬇ Export PDF</text>
  
  <!-- Main content area -->
  <rect x="280" y="36" width="520" height="564" fill="#1e1f33"/>
  
  <!-- Toolbar -->
  <rect x="280" y="36" width="520" height="44" fill="#1a1b2e"/>
  <rect x="300" y="48" width="24" height="20" rx="4" fill="#2a2b45">−</rect>
  <text x="345" y="62" text-anchor="middle" fill="#a0a0c0" font-family="Segoe UI" font-size="11">100%</text>
  <rect x="370" y="48" width="24" height="20" rx="4" fill="#2a2b45">+</rect>
  <rect x="400" y="48" width="24" height="20" rx="4" fill="#2a2b45">⟲</rect>
  
  <rect x="480" y="45" width="80" height="26" rx="6" fill="#7c6bf0">
    <text x="520" y="63" text-anchor="middle" fill="white" font-family="Segoe UI" font-size="10">🎨 Colored</text>
  </rect>
  <rect x="565" y="45" width="80" height="26" rx="6" fill="#2a2b45">
    <text x="605" y="63" text-anchor="middle" fill="#a0a0c0" font-family="Segoe UI" font-size="10">📄 Original</text>
  </rect>
  
  <!-- Preview area -->
  <rect x="300" y="100" width="480" height="400" fill="#1e1f33"/>
  
  <!-- PDF preview (white page) -->
  <rect x="420" y="180" width="160" height="220" rx="4" fill="white" filter="drop-shadow(0 8 16 rgba(0,0,0,0.3))"/>
  <rect x="435" y="200" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="215" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="230" width="100" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="250" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="265" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="280" width="80" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="310" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="325" width="130" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="435" y="340" width="110" height="8" rx="2" fill="#e0e0e0"/>
  
  <!-- Color overlay gradient on preview -->
  <rect x="420" y="180" width="160" height="220" rx="4" fill="url(#colorOverlay)" opacity="0.15"/>
  
  <!-- Thumbnails strip -->
  <rect x="280" y="520" width="520" height="80" fill="#1a1b2e"/>
  <rect x="300" y="535" width="50" height="65" rx="4" fill="white" stroke="#7c6bf0" stroke-width="2"/>
  <rect x="360" y="535" width="50" height="65" rx="4" fill="white"/>
  <rect x="420" y="535" width="50" height="65" rx="4" fill="white"/>
  <rect x="480" y="535" width="50" height="65" rx="4" fill="white"/>
  <rect x="540" y="535" width="50" height="65" rx="4" fill="white"/>
  
  <defs>
    <linearGradient id="exportGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6bf0"/>
      <stop offset="100%" stop-color="#5a49d4"/>
    </linearGradient>
    <linearGradient id="colorOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6bf0"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
  </defs>
</svg>
